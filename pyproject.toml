[project]
name = "ps5probe"
version = "0.1.0"
description = "Phase 1 measurement harness for the PS5 Pro stock tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "httpx>=0.27",
    "lxml>=5",
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ps5probe = "ps5probe.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ps5probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
