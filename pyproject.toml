[project]
name = "ps5probe"
version = "0.1.0"
description = "Phase 1 measurement harness for the PS5 Pro stock tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5",
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["flask>=3"]

[project.scripts]
ps5probe = "ps5probe.cli:main"
ps5probe-web = "ps5probe.web:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ps5probe*"]

[tool.setuptools.package-data]
"ps5probe.web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
